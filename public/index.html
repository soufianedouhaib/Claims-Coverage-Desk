<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Claims Coverage Desk</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css?v=6">
</head>
<body>
<div class="signin-wrap">
  <div class="signin">
    <div class="brand-lg">
      <svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#2f6fd6"/><path d="M16 6l8 3v6.2c0 5-3.4 9.2-8 10.8-4.6-1.6-8-5.8-8-10.8V9l8-3z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M12.3 15.8l2.6 2.6 4.8-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>Claims Coverage Desk<small>Home and contents coverage assessment</small></div>
    </div>
    <form class="card card-pad form-grid" id="f" novalidate>
      <h1>Sign in</h1>
      <div class="alert bad" id="err" role="alert" hidden></div>
      <label class="field">Email<input type="email" id="email" autocomplete="username" required></label>
      <label class="field">Password<input type="password" id="pw" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit" id="go">Sign in</button>
      <p class="small muted" style="margin:0">Accounts are created by your administrator. Ask them if you need access or a new password.</p>
    </form>
    <section class="card card-pad demo-box" id="demo" hidden aria-labelledby="demoTitle">
      <h2 id="demoTitle">Demo accounts</h2>
      <p class="small muted" style="margin:4px 0 12px">Sign in with one click to try each role.</p>
      <div class="demo-list" id="demoList"></div>
    </section>
  </div>
</div>
<script src="/common.js?v=6"></script>
<script src="/login.js?v=6"></script>
</body>
</html>
